name: Fix LittleFS offset

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-littlefs-offset.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sửa offset LittleFS
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p = Path("utils.py")
          s = p.read_text(encoding="utf-8")
          old = 'r"littlefs\\.bin$",\n        "0x3D0000",'
          new = 'r"littlefs\\.bin$",\n        "0x290000",'
          if old not in s:
              if 'r"littlefs\\.bin$",\n        "0x290000",' in s:
                  print("LittleFS offset đã là 0x290000")
                  raise SystemExit(0)
              raise SystemExit("Không tìm thấy pattern LittleFS offset cần sửa")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Kiểm tra cú pháp
        run: python -m py_compile utils.py

      - name: Commit thay đổi
        shell: bash
        run: |
          if git diff --quiet -- utils.py; then
            echo "Không có thay đổi cần commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utils.py
          git commit -m "fix(flash): use 0x290000 LittleFS offset"
          git push
